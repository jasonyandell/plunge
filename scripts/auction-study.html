<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Walt bidding study</title>

<h1>Bidding speed and early-pass study</h1><p>Uses synthetic hands. Completed seeds stay on this device; stopping loses only the current seed. Early-pass rules are measured here and do not change the game.</p>

<button id="run">Run / resume</button><button id="stop" disabled>Stop</button><pre id="status">Ready.</pre><textarea id="results" aria-label="Study results" readonly></textarea>
