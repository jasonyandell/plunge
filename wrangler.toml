name = "plunge"
compatibility_date = "2026-05-14"
main = "worker/index.ts"

# Family jam builder: "codex" (Codex cloud @codex mentions) or "action" (.github/workflows/jam.yml).
# Secrets JAM_GITHUB_TOKEN and JAM_PASSPHRASE are set with `wrangler secret put`.
[vars]
JAM_BACKEND = "codex"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "QUESTIONS"
database_name = "plunge-questions"
database_id = "98730843-94b0-4507-b3c1-91fb12f0702a"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "PlungeRoom"

[[migrations]]
tag = "family-rooms-v1"
new_sqlite_classes = ["PlungeRoom"]
