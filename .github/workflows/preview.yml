name: PR preview
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number (open deploys; closed cleans up)
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

# Serialize deploy/cleanup together. Never cancel a resource mutation halfway.
concurrency:
  group: preview-pr-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  resolve:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
      sha: ${{ steps.pr.outputs.sha }}
      state: ${{ steps.pr.outputs.state }}
    steps:
      - uses: actions/github-script@v7
        id: pr
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        with:
          script: |
            const number = process.env.PR_NUMBER;
            if (!/^[1-9][0-9]{0,8}$/.test(number)) throw new Error('Invalid PR number');
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: Number(number)});
            if (pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.notice('Fork PRs run CI without deployment credentials.');
              return;
            }
            core.setOutput('pr', number);
            core.setOutput('sha', pr.head.sha);
            core.setOutput('state', pr.state);

  # Runs the PR's own code: its dependencies, tests and build. It is given no credential.
  build:
    needs: resolve
    if: needs.resolve.outputs.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      protocol: ${{ steps.tools.outputs.protocol }}
    defaults:
      run:
        working-directory: app
    env:
      PR_NUMBER: ${{ needs.resolve.outputs.pr }}
      PREVIEW_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      # The main branch's tools: the fallback for older PRs, and the source of the
      # configuration used to bundle the Worker.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: preview-tools
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: app
          persist-credentials: false
      # Same-repository heads explicitly select the local-only or rooms protocol.
      # Decide by reading the exact checked-out head before running branch code.
      # Neither protocol can bind question storage or production resources.
      - name: Choose build tools
        id: tools
        run: |
          marker="^export const PREVIEW_PROTOCOL = 'family-rooms-v1';\$"
          local_marker="^export const PREVIEW_PROTOCOL = 'local-only-v1';\$"
          if grep -q "$marker" scripts/preview.mjs 2>/dev/null; then
            tools="$PWD/scripts"; protocol=family-rooms-v1; rooms=experimental
            echo "Using this PR's experimental room build tools."
          elif grep -q "$local_marker" scripts/preview.mjs 2>/dev/null; then
            tools="$PWD/scripts"; protocol=local-only-v1; rooms=off
            echo "Using this PR's local-only build tools."
          else
            tools="$GITHUB_WORKSPACE/preview-tools/scripts"; protocol=local-only-v1; rooms=off
            echo "Using local-only fallback tools from the main branch."
          fi
          grep -Eq "$marker|$local_marker" "$tools/preview.mjs" || { echo "::error::Unsupported preview tools."; exit 1; }
          echo "PREVIEW_TOOLS=$tools" >> "$GITHUB_ENV"
          echo "PREVIEW_PROTOCOL_SELECTED=$protocol" >> "$GITHUB_ENV"
          echo "PREVIEW_ROOMS=$rooms" >> "$GITHUB_ENV"
          echo "protocol=$protocol" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: node --test "$PREVIEW_TOOLS/test-preview.mjs"
      - run: python3 scripts/test-update-walt.py
      - run: npm run typecheck
      - run: npm test
      - name: Build the selected commit with device-only questions
        run: |
          GITHUB_SHA="$PREVIEW_SHA" PLUNGE_ROOMS="$PREVIEW_ROOMS" PLUNGE_QUESTIONS=local-only npm run build
          node "$PREVIEW_TOOLS/preview.mjs" stamp "$PR_NUMBER" "$PREVIEW_SHA" "$PREVIEW_PROTOCOL_SELECTED"
      # The deploy job never installs or runs this PR's code, so the Worker is bundled here.
      - name: Bundle the Worker for the deploy job
        run: |
          node ../preview-tools/scripts/preview.mjs config "$PR_NUMBER" "$PREVIEW_PROTOCOL_SELECTED"
          npx wrangler deploy --dry-run --outdir ../prebuilt/worker --config wrangler.preview.generated.json
          cp -R dist ../prebuilt/dist
      - uses: actions/upload-artifact@v4
        with:
          name: preview
          path: prebuilt
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # Holds the Cloudflare keys, so it runs no PR code: only the main branch's tools,
  # which copy the build job's output in as plain files.
  deploy:
    needs: [resolve, build]
    if: needs.resolve.outputs.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      deployments: write
    env:
      PR_NUMBER: ${{ needs.resolve.outputs.pr }}
      PREVIEW_SHA: ${{ needs.resolve.outputs.sha }}
      PREVIEW_PROTOCOL_SELECTED: ${{ needs.build.outputs.protocol }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: preview-tools
          persist-credentials: false
      # No shared cache here: this job installs only what the main branch's lockfile names.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the main branch's deployment tools
        working-directory: preview-tools
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: preview
          path: prebuilt
      - name: Check that the PR is still open at this commit
        id: current
        uses: actions/github-script@v7
        with:
          script: |
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: Number(process.env.PR_NUMBER)});
            core.setOutput('yes', pr.state === 'open' && pr.head.sha === process.env.PREVIEW_SHA);
      - name: Generate the isolated preview configuration
        if: steps.current.outputs.yes == 'true'
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir deploy && cd deploy
          node ../preview-tools/scripts/preview.mjs prepare-prebuilt "$PR_NUMBER" "$PREVIEW_PROTOCOL_SELECTED" ../prebuilt
      - name: Deploy this preview
        if: steps.current.outputs.yes == 'true'
        working-directory: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ../preview-tools/node_modules/.bin/wrangler deploy --config wrangler.preview.generated.json
      - name: Verify deployed app and local-only questions
        if: steps.current.outputs.yes == 'true'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: node preview-tools/scripts/preview.mjs smoke "$PREVIEW_URL" "$PREVIEW_SHA" "$PREVIEW_PROTOCOL_SELECTED"
      - name: Publish the preview link in GitHub
        if: steps.current.outputs.yes == 'true'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            const environment = `preview-pr-${process.env.PR_NUMBER}`;
            const {data: deployment} = await github.rest.repos.createDeployment({
              ...context.repo, ref: process.env.PREVIEW_SHA, environment,
              auto_merge: false, required_contexts: [], production_environment: false, transient_environment: true,
              description: `PR #${process.env.PR_NUMBER} preview`,
            });
            await github.rest.repos.createDeploymentStatus({
              ...context.repo, deployment_id: deployment.id, state: 'success',
              environment_url: process.env.PREVIEW_URL,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              auto_inactive: true,
            });
            await core.summary.addHeading(`Preview PR #${process.env.PR_NUMBER}`)
              .addLink('Open the preview', process.env.PREVIEW_URL)
              .addRaw(`\n\nCommit: ${process.env.PREVIEW_SHA}\n\nThis preview has no question database: questions stay on the device that saved them and are never uploaded.\n`).write();

  cleanup:
    needs: resolve
    if: needs.resolve.outputs.state == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: write
    env:
      PR_NUMBER: ${{ needs.resolve.outputs.pr }}
    steps:
      # Cleanup holds the Cloudflare keys too, so it runs the main branch's tools, never the PR's.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove this PR's Worker and any legacy preview database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/preview.mjs cleanup "$PR_NUMBER"
      - name: Retire the preview link
        uses: actions/github-script@v7
        with:
          script: |
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              ...context.repo, environment: `preview-pr-${process.env.PR_NUMBER}`, per_page: 100,
            });
            for (const deployment of deployments) {
              await github.rest.repos.createDeploymentStatus({
                ...context.repo, deployment_id: deployment.id, state: 'inactive',
                description: 'PR closed; preview resources removed.',
              });
            }
            await core.summary.addRaw(`Preview PR #${process.env.PR_NUMBER} removed.\n`).write();
