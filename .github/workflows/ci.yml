name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/test-preview.mjs scripts/test-ideas-builder.mjs scripts/test-idea-releases.mjs scripts/test-prepare-mcp.mjs scripts/test-production-profile.mjs
      - run: python3 scripts/test-update-walt.py
      - run: npm test
      - run: PLUNGE_ROOMS=experimental npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-family-discovery-browser.mjs
      - run: node scripts/test-hand-pause-browser.mjs
      - run: node scripts/test-idea-accept-browser.mjs
      - run: node scripts/test-screen-idea-browser.mjs
      - run: node scripts/test-mcp-browser.mjs
      - run: npm run test:offline:browser
      - run: npm run test:zeb:browser
