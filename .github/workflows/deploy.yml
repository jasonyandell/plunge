name: Deploy to Cloudflare Workers
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      PLUNGE_DEPLOY_PROFILE: ${{ vars.PLUNGE_DEPLOY_PROFILE || 'core' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node --test scripts/test-preview.mjs scripts/test-prepare-kv.mjs scripts/test-production-profile.mjs
      - run: python3 scripts/test-setup-kv-token.py
      - run: python3 scripts/test-update-walt.py
      - run: npm run typecheck
      - run: npm test
      - run: PLUNGE_ROOMS=experimental npm run build
      - run: printf '{"build":"%s"}' "$GITHUB_SHA" > dist/version.json
      - name: Select production profile
        run: node scripts/production-profile.mjs
      - name: Prepare OAuth and ideas KV
        if: env.PLUNGE_DEPLOY_PROFILE == 'companions'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_KV_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/prepare-kv.mjs
      - name: Prepare question database and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PLUNGE_IDEAS_ADMIN_TOKEN: ${{ secrets.PLUNGE_IDEAS_ADMIN_TOKEN }}
        run: |
          node scripts/prepare-questions.mjs
          npx wrangler d1 migrations apply QUESTIONS --remote
          node scripts/ideas/install-secret.mjs
          npx wrangler deploy
